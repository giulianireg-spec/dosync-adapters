<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Código para DoSync</title>
<style>
  :root { --bg: #ffffff; --fg: #0a0a0a; --muted: #525252; --accent: #4d7c0f; --box: #f5f5f5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; --accent: #a3e635; --box: #1c1c1c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; }
  #code { display: block; width: 100%; box-sizing: border-box; padding: 14px; border-radius: 10px; border: 0; background: var(--box); color: var(--fg); font: 600 16px ui-monospace, monospace; word-break: break-all; }
  button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #0a0a0a; font-weight: 700; font-size: 16px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Copia este código en DoSync</h1>
  <!-- La página solo muestra el código que vino en la dirección: no lo guarda ni lo manda a ningún lado. -->
  <textarea id="code" rows="3" readonly></textarea>
  <button id="copy">Copiar</button>
  <p id="note">Vuelve a la app DoSync, pega el código y toca Confirmar.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  const box = document.getElementById('code');
  if (code) box.value = code;
  else { box.value = ''; document.getElementById('note').textContent = q.get('error_description') || q.get('error') || 'No llegó ningún código: vuelve a intentar desde la app.'; }
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(box.value); } catch { box.select(); document.execCommand('copy'); }
    document.getElementById('copy').textContent = 'Copiado';
  };
</script>
</body>
</html>
